# PostIMAP Configuration
# All defaults defined here. Secrets use ${VAR} -- resolved from env at startup.
# This file IS the config documentation. Override sparse values in config-custom/.

database:
  # PostgreSQL connection parameters (composed into a connection URL at startup)
  host: localhost
  port: 5432
  name: postimap
  user: postimap
  password: ${DB_PASSWORD}
  ssl:
    # Enable TLS for the PostgreSQL connection -- required by most managed/Kubernetes
    # PostgreSQL (e.g. CloudNativePG serves TLS by default)
    enabled: false
    # Reject certificates that don't validate against a trusted CA
    reject_unauthorized: true
    # Path to a PEM CA bundle to trust in addition to the system roots (e.g. a cluster's
    # internal CA, mounted from a Kubernetes Secret). Leave unset to use the system roots.
    ca_file: ${DB_SSL_CA_FILE:-}

imap:
  # Reject unauthorized TLS certificates (disable for self-signed certs in dev)
  tls_reject_unauthorized: true

sync:
  # Periodic full sync interval
  interval_seconds: 60
  # IMAP IDLE connections restart after this duration (RFC recommends <30min)
  idle_restart_seconds: 300
  # Outbound queue poll interval -- a fallback for when NOTIFY is missed; a wakeup drains
  # the whole backlog rather than waiting for the next one, so this bounds worst-case
  # latency rather than throughput
  outbound_poll_seconds: 5
  # How many sync_queue rows are claimed per round trip while draining the outbound queue.
  # A claimed batch that shares the same action, folder and (for flags) flag name becomes
  # one IMAP command instead of one per message, so a larger batch means more messages
  # that can land in the same command during a bulk action. Lower this if the IMAP
  # server's command-line length limit is tighter than usual
  outbound_batch_size: 500
  # Max retry attempts for failed outbound operations
  max_retry_attempts: 5
  # Folders watched via IMAP IDLE for near-real-time sync. Each one holds open its own
  # dedicated connection (IDLE occupies the whole connection, so it can't be shared across
  # folders) -- an account with many folders would otherwise open one connection per
  # folder, and real IMAP providers commonly cap concurrent connections per account around
  # 15. Folders not listed here are still synced, just on the periodic interval above
  # instead of near-instantly. Folder names not present on a given account are ignored.
  idle_folders: ["INBOX"]
  # On servers with neither CONDSTORE nor QRESYNC, a cycle whose mailbox message count and
  # UIDNEXT have not moved is skipped rather than paying a UID SEARCH and a fetch of every
  # flag set. A flag changed by another client moves neither number, so the skip is bounded:
  # after this long the full diff runs regardless. Trades flag-change latency against load
  full_tier_max_skip_seconds: 600

storage:
  # Messages larger than this are stored as envelope and flags only (is_truncated = true)
  # -- their body, headers and attachments are never fetched from IMAP, so one oversized
  # message can't materialize its whole size (plus every attachment) in memory
  max_message_bytes: 52428800 # 50 MB

retention:
  # How often the retention purge runs
  interval_hours: 24
  # Hard-delete messages this many days after they were expunged from IMAP (the row
  # survives with expunged_at set until then, for audit/undo)
  purge_expunged_after_days: 30
  # Hard-delete folders this many days after they were tombstoned (absent from a LIST
  # response) -- long enough that a flaky or partial LIST reappearing is no longer plausible
  purge_folders_after_days: 7
  # Hard-delete completed/dead sync_queue rows and sync_audit rows older than this
  audit_days: 90
  # Hard-delete sync_notifications this many days after they were acknowledged. An
  # unacknowledged notification is never removed by age -- it is the only record a
  # consumer has that one of its writes never reached the server
  notifications_days: 90
  # Hard-delete tombstoned dav_objects this many days after they were deleted
  purge_dav_objects_after_days: 30
  # Hard-delete tombstoned dav_collections this many days after they were deleted
  purge_dav_collections_after_days: 7

dav:
  # How often each DAV account polls its calendar and address-book homes
  poll_seconds: 60
  # Independent of token health: run a full etag diff on every collection this often, to
  # catch a server that silently accepted a stale sync-token and reported no changes
  full_reconcile_seconds: 21600
  # Reject unauthorized TLS certificates (disable for self-signed certs in dev)
  tls_reject_unauthorized: true
  # HTTP request timeout for a single DAV request
  request_timeout_seconds: 30
  # calendar-multiget/addressbook-multiget chunk size during a collection's initial backfill
  multiget_chunk: 50

logging:
  # pino log level: trace, debug, info, warn, error, fatal
  level: info

health:
  # HTTP health check endpoint port
  port: 8090

# Credential encryption key (hex-encoded 32-byte AES-256 key, 64 hex chars)
# Optional -- imap_password/smtp_password are stored with a 1-byte format prefix; unset
# means PostIMAP writes format 0x00 (plaintext UTF-8) instead of 0x01 (AES-256-GCM)
# Generate with: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
encryption_key: ${ENCRYPTION_KEY:-}
