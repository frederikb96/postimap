# Example CloudNativePG Cluster providing the PostgreSQL database this chart
# points at. Not applied by this chart -- PostgreSQL is deliberately not a
# chart dependency (see the chart README). Apply this yourself, once, in the
# CloudNativePG operator's docs: https://cloudnative-pg.io/documentation/
#
# This creates one CNPG Cluster with two login roles: `postimap` (owns the
# schema, runs migrations at startup -- needs CREATEDB/schema-owner-equivalent
# privileges within its own database) and `postimap_consumer` (the consuming
# application's own role). Keeping these separate means the application can
# never alter PostIMAP's schema, and a bug in the application's SQL can't
# touch other databases in the cluster.
#
# The write contract itself lives in a third role, `postimap_app`, which
# PostIMAP's migrations create as NOLOGIN and grant the exact columns a
# consumer may write. Nothing logs in as it; a consumer's login role is
# granted membership in it instead -- see the bootstrap step further down.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postimap-db
spec:
  instances: 3
  storage:
    size: 10Gi
  bootstrap:
    initdb:
      database: postimap
      owner: postimap
      secret:
        name: postimap-db-owner-credentials
  managed:
    roles:
      - name: postimap_consumer
        ensure: present
        login: true
        passwordSecret:
          name: postimap-consumer-credentials
---
# CNPG generates the `postimap` owner role's password itself when the
# secret referenced by `bootstrap.initdb.secret.name` doesn't already exist
# -- create it up front instead if you want a known password to feed into
# this chart's `secret.dbPassword` / `existingSecret`.
apiVersion: v1
kind: Secret
metadata:
  name: postimap-db-owner-credentials
type: kubernetes.io/basic-auth
stringData:
  username: postimap
  password: replace-with-a-generated-password
---
apiVersion: v1
kind: Secret
metadata:
  name: postimap-consumer-credentials
type: kubernetes.io/basic-auth
stringData:
  username: postimap_consumer
  password: replace-with-a-generated-password
---
# Bootstrap step. Run once against the `postimap` database, and only after
# PostIMAP has started at least once -- its migrations create `postimap_app`,
# so running this first fails with "role postimap_app does not exist".
#
#   GRANT CONNECT ON DATABASE postimap TO postimap_consumer;
#   GRANT postimap_app TO postimap_consumer;
#
# That is the whole bootstrap. The individual table and column grants come
# with membership in `postimap_app` and are maintained by the migrations, so
# there is nothing here to keep in step with the schema; see
# docs/consumer-contract.md for what membership actually permits.
