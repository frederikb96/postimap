{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postimap.fullname" . }}
  labels:
    {{- include "postimap.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.existingSecretKeys.dbPassword }}: {{ .Values.secret.dbPassword | quote }}
  {{- if .Values.secret.encryptionKey }}
  {{ .Values.existingSecretKeys.encryptionKey }}: {{ .Values.secret.encryptionKey | quote }}
  {{- end }}
{{- end }}
