name: Release

on:
  push:
    tags:
      - "v*"
      - "v*-rc*"
      - "v*-beta*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality-gate:
    runs-on: arc-runner-postimap
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - name: Verify tag, package.json and chart all agree
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          CHART_VERSION="$(grep -m1 '^version:' charts/postimap/Chart.yaml | awk '{print $2}')"
          APP_VERSION="$(grep -m1 '^appVersion:' charts/postimap/Chart.yaml | tr -d '"' | awk '{print $2}')"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi
          if [ "$CHART_VERSION" != "$PKG_VERSION" ] || [ "$APP_VERSION" != "$PKG_VERSION" ]; then
            echo "Chart is $CHART_VERSION/$APP_VERSION but package.json is $PKG_VERSION" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit

  build-and-push:
    runs-on: arc-runner-postimap
    needs: quality-gate
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-rc') && !contains(github.ref, '-beta') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}

  publish-chart:
    runs-on: arc-runner-postimap
    needs: build-and-push
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
      - name: Package and push the chart
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          helm package charts/postimap --version "$VERSION" --app-version "$VERSION" -d /tmp/chart
          helm push "/tmp/chart/postimap-$VERSION.tgz" "oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts"
