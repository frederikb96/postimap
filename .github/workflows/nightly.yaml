name: Nightly
on:
  schedule:
    - cron: '0 3 * * *'
  push:
    tags: ['v*']

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chaos:
    runs-on: arc-runner-postimap
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Pre-pull container images
        run: |
          docker pull postgres:18-alpine &
          docker pull dovecot/dovecot:2.4.5 &
          docker pull ghcr.io/shopify/toxiproxy:2.12.0 &
          wait
      - run: npm run test:chaos
        env:
          CI: 'true'
          TESTCONTAINERS_RYUK_DISABLED: 'true'
          POSTIMAP_IMAP_TLS_REJECT_UNAUTHORIZED: 'false'

  property:
    runs-on: arc-runner-postimap
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Pre-pull container images
        run: |
          docker pull postgres:18-alpine &
          docker pull dovecot/dovecot:2.4.5 &
          wait
      - run: npm run test:property
        env:
          CI: 'true'
          TESTCONTAINERS_RYUK_DISABLED: 'true'
          POSTIMAP_IMAP_TLS_REJECT_UNAUTHORIZED: 'false'
