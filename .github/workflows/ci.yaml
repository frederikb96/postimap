name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    runs-on: arc-runner-postimap
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  chart:
    runs-on: arc-runner-postimap
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - name: Chart version tracks package.json
        run: |
          PKG_VERSION="$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' package.json | head -1)"
          CHART_VERSION="$(grep -m1 '^version:' charts/postimap/Chart.yaml | awk '{print $2}')"
          APP_VERSION="$(grep -m1 '^appVersion:' charts/postimap/Chart.yaml | tr -d '"' | awk '{print $2}')"
          if [ "$CHART_VERSION" != "$PKG_VERSION" ] || [ "$APP_VERSION" != "$PKG_VERSION" ]; then
            echo "Chart is $CHART_VERSION/$APP_VERSION but package.json is $PKG_VERSION" >&2
            exit 1
          fi
      - run: helm lint charts/postimap --strict -f charts/postimap/examples/values-production.yaml
      - name: Render every optional template
        run: |
          helm template postimap charts/postimap \
            -f charts/postimap/examples/values-production.yaml \
            --set podDisruptionBudget.enabled=true \
            --set networkPolicy.enabled=true > /tmp/rendered.yaml
          test -s /tmp/rendered.yaml
      - name: Reject a replica count the service cannot support
        run: |
          if helm template postimap charts/postimap \
               -f charts/postimap/examples/values-production.yaml \
               --set replicaCount=3 >/dev/null 2>&1; then
            echo "values.schema.json no longer pins replicaCount to 1" >&2
            exit 1
          fi

  unit:
    runs-on: arc-runner-postimap
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:unit

  integration:
    runs-on: arc-runner-postimap
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Pre-pull container images
        run: |
          docker pull postgres:18-alpine &
          docker pull dovecot/dovecot:2.4.5 &
          wait
      - run: npm run test:integration
        env:
          CI: 'true'
          TESTCONTAINERS_RYUK_DISABLED: 'true'
          POSTIMAP_IMAP_TLS_REJECT_UNAUTHORIZED: 'false'

  e2e:
    runs-on: arc-runner-postimap
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Pre-pull container images
        run: |
          docker pull postgres:18-alpine &
          docker pull dovecot/dovecot:2.4.5 &
          wait
      - run: npm run test:e2e
        env:
          CI: 'true'
          TESTCONTAINERS_RYUK_DISABLED: 'true'
          POSTIMAP_IMAP_TLS_REJECT_UNAUTHORIZED: 'false'
