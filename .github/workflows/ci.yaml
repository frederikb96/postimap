# 🚨 This workflow runs on GitHub-hosted runners, never on a self-hosted one.
#
# It triggers on `pull_request`, and for that trigger GitHub runs the workflow file as it exists
# on the pull request's own head. On a public repository that means a stranger can rewrite this
# file in their fork and execute whatever they like on whatever machine it names — so naming a
# self-hosted runner here would hand them a shell inside the cluster that runner lives in.
#
# Standard GitHub-hosted runners are unmetered on public repositories, so there is no cost
# argument for doing otherwise. The push- and schedule-triggered workflows, which require write
# access to reach, still use the self-hosted runner.
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Chart version tracks package.json
        run: |
          PKG_VERSION="$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' package.json | head -1)"
          CHART_VERSION="$(grep -m1 '^version:' charts/postimap/Chart.yaml | awk '{print $2}')"
          APP_VERSION="$(grep -m1 '^appVersion:' charts/postimap/Chart.yaml | tr -d '"' | awk '{print $2}')"
          if [ "$CHART_VERSION" != "$PKG_VERSION" ] || [ "$APP_VERSION" != "$PKG_VERSION" ]; then
            echo "Chart is $CHART_VERSION/$APP_VERSION but package.json is $PKG_VERSION" >&2
            exit 1
          fi
      - run: helm lint charts/postimap --strict -f charts/postimap/examples/values-production.yaml
      - name: Render every optional template
        run: |
          helm template postimap charts/postimap \
            -f charts/postimap/examples/values-production.yaml \
            --set podDisruptionBudget.enabled=true \
            --set networkPolicy.enabled=true > /tmp/rendered.yaml
          test -s /tmp/rendered.yaml
      - name: Reject a replica count the service cannot support
        run: |
          if helm template postimap charts/postimap \
               -f charts/postimap/examples/values-production.yaml \
               --set replicaCount=3 >/dev/null 2>&1; then
            echo "values.schema.json no longer pins replicaCount to 1" >&2
            exit 1
          fi

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:unit

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Pre-pull container images
        run: |
          docker pull postgres:18-alpine &
          docker pull dovecot/dovecot:2.4.5 &
          docker pull axllent/mailpit:v1.28.3 &
          docker pull tomsquest/docker-radicale:3.7.6.0 &
          wait
      - run: npm run test:integration
        env:
          CI: 'true'
          TESTCONTAINERS_RYUK_DISABLED: 'true'
          POSTIMAP_IMAP_TLS_REJECT_UNAUTHORIZED: 'false'

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Pre-pull container images
        run: |
          docker pull postgres:18-alpine &
          docker pull dovecot/dovecot:2.4.5 &
          docker pull axllent/mailpit:v1.28.3 &
          docker pull tomsquest/docker-radicale:3.7.6.0 &
          wait
      - run: npm run test:e2e
        env:
          CI: 'true'
          TESTCONTAINERS_RYUK_DISABLED: 'true'
          POSTIMAP_IMAP_TLS_REJECT_UNAUTHORIZED: 'false'
